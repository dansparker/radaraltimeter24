<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img">
<title>Verarbeitung pro Rampe</title>
<desc>ADC-Frame, Aufbereitung, Hann-Fenster und FFT, PSD-Mittelung, OS-CFAR, Bestätigung im aktuellen Frame, Interpolation, Kandidatenliste.</desc>
<style>
.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="280" fill="#FFFFFF"/>
<g class="c-gray"><rect x="50" y="40" width="130" height="56" rx="8"/><text class="th" x="115" y="58" text-anchor="middle" dominant-baseline="central">ADC-Frame</text><text class="ts" x="115" y="78" text-anchor="middle" dominant-baseline="central">2432 / 704 Werte</text></g>
<g class="c-purple"><rect x="200" y="40" width="130" height="56" rx="8"/><text class="th" x="265" y="58" text-anchor="middle" dominant-baseline="central">Aufbereitung</text><text class="ts" x="265" y="78" text-anchor="middle" dominant-baseline="central">DC, Hintergrund</text></g>
<g class="c-purple"><rect x="350" y="40" width="130" height="56" rx="8"/><text class="th" x="415" y="58" text-anchor="middle" dominant-baseline="central">Hann + FFT</text><text class="ts" x="415" y="78" text-anchor="middle" dominant-baseline="central">2048 / 512 Punkte</text></g>
<g class="c-purple"><rect x="500" y="40" width="130" height="56" rx="8"/><text class="th" x="565" y="58" text-anchor="middle" dominant-baseline="central">PSD mitteln</text><text class="ts" x="565" y="78" text-anchor="middle" dominant-baseline="central">Welch über Rampen</text></g>
<line x1="180" y1="68" x2="198" y2="68" class="arr" marker-end="url(#a)"/>
<line x1="330" y1="68" x2="348" y2="68" class="arr" marker-end="url(#a)"/>
<line x1="480" y1="68" x2="498" y2="68" class="arr" marker-end="url(#a)"/>
<line x1="565" y1="96" x2="565" y2="148" class="arr" marker-end="url(#a)"/>
<g class="c-teal"><rect x="500" y="150" width="130" height="56" rx="8"/><text class="th" x="565" y="168" text-anchor="middle" dominant-baseline="central">OS-CFAR</text><text class="ts" x="565" y="188" text-anchor="middle" dominant-baseline="central">Pfa 1e-4, SNR 12 dB</text></g>
<g class="c-teal"><rect x="350" y="150" width="130" height="56" rx="8"/><text class="th" x="415" y="168" text-anchor="middle" dominant-baseline="central">Bestätigen</text><text class="ts" x="415" y="188" text-anchor="middle" dominant-baseline="central">aktueller Frame</text></g>
<g class="c-teal"><rect x="200" y="150" width="130" height="56" rx="8"/><text class="th" x="265" y="168" text-anchor="middle" dominant-baseline="central">Interpolation</text><text class="ts" x="265" y="188" text-anchor="middle" dominant-baseline="central">Hann, &lt; 0,01 Bin</text></g>
<g class="c-gray"><rect x="50" y="150" width="130" height="56" rx="8"/><text class="th" x="115" y="168" text-anchor="middle" dominant-baseline="central">Kandidaten</text><text class="ts" x="115" y="188" text-anchor="middle" dominant-baseline="central">f, Leistung, SNR</text></g>
<line x1="500" y1="178" x2="482" y2="178" class="arr" marker-end="url(#a)"/>
<line x1="350" y1="178" x2="332" y2="178" class="arr" marker-end="url(#a)"/>
<line x1="200" y1="178" x2="182" y2="178" class="arr" marker-end="url(#a)"/>
<g class="c-gray"><rect x="50" y="236" width="14" height="14" rx="3"/></g><text class="ts" x="72" y="243" dominant-baseline="central">Ein-/Ausgabe</text>
<g class="c-purple"><rect x="200" y="236" width="14" height="14" rx="3"/></g><text class="ts" x="222" y="243" dominant-baseline="central">Spektrum</text>
<g class="c-teal"><rect x="350" y="236" width="14" height="14" rx="3"/></g><text class="ts" x="372" y="243" dominant-baseline="central">Detektion</text>
</svg>
