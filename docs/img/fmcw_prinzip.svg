<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img">
<title>FMCW-Dreieckmodulation</title>
<desc>Sendefrequenz steigt und fällt linear; das Echo ist um die Laufzeit verzögert und durch Doppler verschoben. Steigende Rampe: f_R minus f_D, fallende Rampe: f_R plus f_D.</desc>
<style>
.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}
.ax{stroke:#5F5E5A;stroke-width:0.8;fill:none}.leader{stroke:#888780;stroke-width:0.6;stroke-dasharray:3 3;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="350" fill="#FFFFFF"/>
<line x1="80" y1="260" x2="80" y2="56" class="ax" marker-end="url(#a)"/>
<line x1="80" y1="260" x2="634" y2="260" class="ax" marker-end="url(#a)"/>
<text class="ts" x="88" y="56" dominant-baseline="central">Frequenz</text>
<text class="ts" x="632" y="276" text-anchor="end" dominant-baseline="central">Zeit</text>
<polyline points="80,240 330,80 580,240" fill="none" stroke="#1D9E75" stroke-width="2"/>
<polyline points="110,232 360,72 610,232" fill="none" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 4"/>
<g stroke="#2C2C2A">
<line x1="200" y1="165" x2="200" y2="172" stroke-width="1.5"/><line x1="194" y1="163.2" x2="206" y2="163.2"/><line x1="194" y1="174.4" x2="206" y2="174.4"/>
<line x1="470" y1="144" x2="470" y2="168" stroke-width="1.5"/><line x1="464" y1="142.4" x2="476" y2="142.4"/><line x1="464" y1="169.6" x2="476" y2="169.6"/>
</g>
<line x1="200" y1="176" x2="214" y2="200" class="leader"/>
<text class="th" x="218" y="206" dominant-baseline="central">f_up = f_R − f_D</text>
<line x1="470" y1="172" x2="456" y2="200" class="leader"/>
<text class="th" x="452" y="206" text-anchor="end" dominant-baseline="central">f_dn = f_R + f_D</text>
<text class="ts" x="205" y="278" text-anchor="middle" dominant-baseline="central">steigende Rampe</text>
<text class="ts" x="455" y="278" text-anchor="middle" dominant-baseline="central">fallende Rampe</text>
<line x1="80" y1="304" x2="108" y2="304" stroke="#1D9E75" stroke-width="2"/>
<text class="ts" x="116" y="304" dominant-baseline="central">Sendesignal</text>
<line x1="250" y1="304" x2="278" y2="304" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ts" x="286" y="304" dominant-baseline="central">Echo: Laufzeit τ (rechts) + Doppler f_D (oben)</text>
<text class="t" x="80" y="330" dominant-baseline="central">f_R = (f_up + f_dn)/2 → Höhe</text>
<text class="t" x="330" y="330" dominant-baseline="central">f_D = (f_dn − f_up)/2 → Vertikalgeschwindigkeit</text>
</svg>
